<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aviso Legal — Sergi Ortiz Gómez</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css" />
    <link rel="stylesheet" href="Legal.styles.css" />
</head>

<body>
    <div id="app">
        <div class="section has-text-centered">
            <p class="subtitle">Cargando...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:#ffeeba;padding:10px;text-align:center;">
        Error al cargar la aplicación.
        <a href="">Recargar</a>
    </div>

    <script>
        // Shared with every *.shotupalbums.com site (app, landing, wiki, share) through a
        // parent-domain cookie; the old per-site localStorage key is only a fallback.
        window.readSharedCulture = () => {
            var match = document.cookie.match(/(?:^|;\s*)shotup-culture=([^;]*)/);
            return match ? decodeURIComponent(match[1]) : null;
        };
        window.writeSharedCulture = (culture) => {
            var host = location.hostname;
            var isShotupHost = host === 'shotupalbums.com' || host.endsWith('.shotupalbums.com');
            var domain = isShotupHost ? '; domain=.shotupalbums.com' : '';
            var secure = location.protocol === 'https:' ? '; secure' : '';
            document.cookie = 'shotup-culture=' + encodeURIComponent(culture)
                + '; path=/; max-age=31536000; samesite=lax' + domain + secure;
        };
        window.getLegalCulture = () => {
            var stored = window.readSharedCulture() || localStorage.getItem('legalCulture');
            if (stored) return stored;
            var lang = (navigator.language || 'es').toLowerCase().substring(0, 2);
            if (lang === 'tl') lang = 'fil';
            return lang;
        };
        // Bandera elegida junto al idioma (español con la de México, inglés con la de Australia...).
        // Misma cookie compartida que usan las apps de Shotup Albums; sólo es cosmética.
        window.getLegalFlag = () => {
            var match = document.cookie.match(/(?:^|;\s*)shotup-flag=([^;]*)/);
            if (match) return decodeURIComponent(match[1]);
            try { return localStorage.getItem('legalFlag'); } catch (e) { return null; }
        };
        window.setLegalFlag = (country) => {
            try { localStorage.setItem('legalFlag', country); } catch (e) { }
            var host = location.hostname;
            var isShotupHost = host === 'shotupalbums.com' || host.endsWith('.shotupalbums.com');
            var domain = isShotupHost ? '; domain=.shotupalbums.com' : '';
            var secure = location.protocol === 'https:' ? '; secure' : '';
            document.cookie = 'shotup-flag=' + encodeURIComponent(country)
                + '; path=/; max-age=31536000; samesite=lax' + domain + secure;
        };
        window.setLegalCulture = (culture) => {
            localStorage.setItem('legalCulture', culture);
            window.writeSharedCulture(culture);
            window.location.reload();
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
